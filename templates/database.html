<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Tabelle</title>
<head>
<body>
    <h1>Tabelle</h1>
    <form method="post">
        <table>
            <tr>
                <th>Databases</th>
                <th>Submit</th>
            </tr>
            {%for i in mycursor%}
            <tr>
                <td>{{i[0]}}</td>
                <td><input type="radio" name="selected_items" value="{{ i[0] }}"></td>
            </tr>
            {%endfor%}
        </table>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
