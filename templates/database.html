<!DOCTYPE html>
<html>
<head>
    <title>Tabelle</title>
    <style>
    table, tr, td{
       border: 1px solid black
    }
    </style>
<head>
<body>
    <h1>Tabelle</h1>
    <form method="post">
        <table>
            <tr>
                <th>Databases</th>
                <th>Submit</th>
            </tr>
            {%for i in mycursor%}
            <tr>
                <td>{{i[0]}}</td>
                <td><input type="radio" name="selected_items" value="{{ i[0] }}"></td>
            </tr>
            {%endfor%}
        </table>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
