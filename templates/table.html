<!DOCTYPE html>
<html>
<head>
   <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
   <title>Table</title>
</head>
<body>
   <h1>Table</h1><br>
   <a  href="/database">Back</a><br>
   <a>Your Database is: {{database}}</a><br>
   <form method="post">
        <table>
            <tr>
                <th>Databases</th>
                <th>Submit</th>
            </tr>
            {%for i in table%}
            <tr>
                <td>{{i[0]}}</td>
                <td><input type="radio" name="selected_items" value="{{ i[0] }}"></td>
            </tr>
            {%endfor%}
        </table>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
